# 抗生素替代物知识图谱 — 实体类型定义
# 基于 schema.md v2 规范

entities:
  # -----------------------------------------------------------------------
  # 1.1 Alternative（抗生素替代物物质）
  # -----------------------------------------------------------------------
  Alternative:
    display_name: "Antibiotic Alternative Substance"
    primary_text: standard_name
    description: >
      Active compound, microorganism, or biological product tested as a
      replacement for in-feed antibiotics in swine production. Includes
      plant extracts, probiotics, organic acids, enzymes, trace elements,
      oligosaccharides, polysaccharides, and bioactive peptides. This entity
      covers SINGLE substances only. For multi-component blends, use the
      Composite_Product entity instead.
    extraction_guidance: |
      ## Extraction Rules for Alternative

      1. SCAN: Search the entire paper, especially the Materials & Methods
         section, for ALL substances administered with the intent to replace
         or reduce antibiotic use in pigs. Look for: feed additives, dietary
         supplements, commercial products, natural compounds, fermentation
         products, probiotics, prebiotics, enzymes, organic acids, plant
         extracts, trace elements, bioactive peptides, and oligosaccharides.

      2. VOCABULARY MATCH: For each substance found, match it against the
         candidate vocabulary in ALTERNATIVE.tsv.
         - Vocabulary match found → record the standard_name as the canonical
           name, and mark match_source accordingly.
         - No vocabulary match AND it is a SINGLE substance → classification
           will be set to "Other" by post-processor. Preserve the original name
           exactly as written in the paper in standard_name.

      3. COMPOSITE PRODUCTS: For multi-component blends, do NOT concatenate
         component names into a single Alternative. Instead:
         a) Create a Composite_Product entity for the blend
         b) Create separate Alternative entities for each component
         c) Link via has_component relationships

      4. ANTIBIOTIC EXCLUSION: All positive-control antibiotics (e.g.,
         Chlortetracycline, Bacitracin, Colistin) MUST NOT be extracted as
         Alternative entities. Their information belongs in the Intervention
         substance_name field.

      5. EVIDENCE: Always provide evidence_text (the original sentence
         mentioning this substance) and source_location (e.g.,
         "Materials and Methods, paragraph 3").
    notes: |
      CRITICAL RULES:
      - DO NOT output 'none', 'unspecified', 'unknown', 'Not reported',
        'N/A', 'na', or any similar placeholder as a value. Use empty
        string "" instead if information is genuinely absent.
      - Preserve the original English name and abbreviation verbatim from
        the source text. Do not invent names or merge entities.
      - Vocabulary source: ALTERNATIVE.tsv, key field: "Alternative (具体物质)",
        class field: "Alternative_Class (一级分类)".

      mutually_exclusive_with: Composite_Product
      dedup_mode: fuzzy
      priority: 2
    vocabulary:
      source: ALTERNATIVE.tsv
      key_field: "Alternative (具体物质)"
      class_field: "Alternative_Class (一级分类)"
      subclass_field: "Subclass (二级分类)"
      match_fields: ["Alternative (具体物质)"]
      match_mode: fuzzy
      inject_in_prompt: false
      value_delimiter: ","
    attributes:
      # LLM-extracted fields
      - {name: standard_name, type: string, required: true, source: llm}
      - {name: abbreviation, type: string, required: false, source: llm}
      - {name: cas_number, type: string, required: false, source: llm}
      - {name: source_organism, type: string, required: false, source: llm}
      - {name: is_synthetic, type: boolean, required: false, source: llm}
      # Post-processed fields (vocabulary matching)
      - {name: classification, type: enum, required: true, source: post,
         values: [Plant_Extract, Trace_Element, Organic_Acid, Probiotic,
                  Polysaccharides_and_Oligosaccharides, Enzyme, Bioactive_Peptides, Other]}
      - {name: subclass, type: string, required: false, source: post}
      - {name: match_source, type: enum, required: true, source: post,
         values: [exact, fuzzy, unmatched]}
      # Engineering-derived fields
      - {name: evidence_text, type: text, required: true, source: align}
      - {name: source_location, type: string, required: true, source: structure}

  # -----------------------------------------------------------------------
  # 1.2 Alternative_Class（物质分类）— 预定义，无需LLM提取
  # -----------------------------------------------------------------------
  Alternative_Class:
    display_name: "Alternative Classification"
    primary_text: class_name
    description: >
      Predefined classification hierarchy for antibiotic alternative substances.
      Populated from the ALTERNATIVE.tsv vocabulary table — no LLM extraction
      needed.
    extraction_guidance: ""
    notes: |
      This entity is predefined and derived from the vocabulary table.
      Standard classes: Plant_Extract, Trace_Element, Organic_Acid, Probiotic,
      Polysaccharides_and_Oligosaccharides, Enzyme, Bioactive_Peptides, Other.
    attributes:
      - {name: class_name, type: string, required: true, source: structure}
      - {name: level, type: integer, required: true, source: structure}
      - {name: description, type: text, required: false, source: structure}

  # -----------------------------------------------------------------------
  # 1.3 Composite_Product（复合产品）
  # -----------------------------------------------------------------------
  Composite_Product:
    display_name: "Composite Product / Commercial Blend"
    primary_text: product_name
    description: >
      A multi-component product (commercial or experimental blend) that
      contains two or more active antibiotic-alternative substances.
      Linked to its individual components via has_component relationships.
      Mutually exclusive with Alternative — a given item is EITHER a single
      Alternative OR a Composite_Product, NEVER both.
    extraction_guidance: |
      ## Three-Step Rule for Composite Products

      1. IDENTIFY: Find multi-component blends (commercial products like
         "Product X", or experimental mixtures with 2+ active substances).

      2. DECOMPOSE: For each component in the blend, create a SEPARATE
         Alternative entity with its own standard_name and evidence_text.

      3. LINK: Populate the "components" field with references to those
         Alternative entities.

      CRITICAL: Do NOT concatenate component names into a single long string
      as the Alternative name. Each component must be its own entity.
    notes: |
      mutually_exclusive_with: Alternative
      dedup_mode: exact
    attributes:
      # LLM-extracted fields
      - {name: product_name, type: string, required: true, source: llm}
      - {name: manufacturer, type: string, required: false, source: llm}
      - {name: is_commercial, type: boolean, required: false, source: llm}
      # Inline relation: components
      - {name: components, type: json_array, required: false, source: llm}
      # Engineering-derived fields
      - {name: evidence_text, type: text, required: true, source: align}
      - {name: source_location, type: string, required: true, source: structure}
    inline_relations:
      - {name: has_component, target: [Alternative, Composite_Product], via_field: components, multiple: true}

  # -----------------------------------------------------------------------
  # 1.4 Literature（文献）— 工程手段从PMC元数据提取
  # -----------------------------------------------------------------------
  Literature:
    display_name: "Literature"
    primary_text: doi
    description: >
      Scientific publication metadata. Created entirely through engineering
      means from PMC XML front-matter — NOT extracted by LLM.
    notes: |
      All attributes are derived from XML metadata. This entity is created
      by the pre_extractor hook, bypassing the LLM entirely.
    attributes:
      - {name: doi, type: string, required: true, source: structure}
      - {name: pmid, type: string, required: false, source: structure}
      - {name: title, type: string, required: true, source: structure}
      - {name: journal, type: string, required: false, source: structure}
      - {name: abstract_conclusion, type: text, required: false, source: structure}
      - {name: publication_year, type: integer, required: false, source: structure}
      - {name: publication_date, type: string, required: false, source: structure}
      - {name: study_design, type: string, required: false, source: structure}

  # -----------------------------------------------------------------------
  # 1.5 Experiment（试验）
  # -----------------------------------------------------------------------
  Experiment:
    display_name: "Experiment"
    primary_text: experiment_id
    description: >
      An individual experiment or trial reported in the literature.
      Each experiment is linked to its animal model, subjects, interventions,
      and measured indicators.
    notes: |
      dedup_mode: exact
    extraction_guidance: |
      ## Extraction Rules

      1. Identify each distinct experiment/trial described in the paper.
         Some papers report multiple experiments (e.g., Exp 1 and Exp 2).

      2. Generate a unique experiment_id (e.g., "Exp_01", "Exp_02").

      3. Record the experimental design details in the description field.
    attributes:
      - {name: experiment_id, type: string, required: true, source: llm}
      - {name: description, type: text, required: false, source: llm}
      - {name: evidence_text, type: text, required: true, source: align}
      - {name: source_location, type: string, required: true, source: structure}
    references:
      - {name: swine_model, target_entity: Swine_Model, target_field: model_type, edge_type: uses_model}
      - {name: swine_info, target_entity: Swine, target_field: breed, edge_type: uses_animal}
      - {name: interventions, target_entity: Intervention, target_field: group_label, edge_type: has_intervention}
      - {name: control_groups, target_entity: Control_Group, target_field: group_name, edge_type: uses_control}
      - {name: indicators, target_entity: Indicator, target_field: standard_name, edge_type: measures_indicator}

  # -----------------------------------------------------------------------
  # 1.6 Swine_Model（动物模型）
  # -----------------------------------------------------------------------
  Swine_Model:
    display_name: "Swine Animal Model"
    primary_text: stressor_name
    description: >
      The animal challenge or health model used in the experiment.
      Describes whether animals were challenged with a stressor (e.g.,
      E. coli, LPS, Diquat) or maintained under normal conditions.
    notes: |
      dedup_mode: exact
    extraction_guidance: |
      ## Extraction Rules

      1. model_type: Use "challenge" if a stressor was applied, "normal"
         if animals were healthy with no challenge.

      2. For multiple stressors applied simultaneously, merge into one
         Swine_Model (e.g., stressor_name = "E. coli K88 + LPS") to
         reduce node redundancy. Alternatively, create one Swine_Model per
         stressor and use multiple uses_model relationships.

      3. If no challenge/stress is described, set model_type = "normal",
         stressor_name = "None".

      4. Clearly distinguish between absolute blank controls and model
         controls (record as Control_Group entities).
    attributes:
      - {name: model_type, type: enum, required: true, source: llm,
         values: [challenge, normal]}
      - {name: stressor_name, type: string, required: true, source: llm}
      - {name: challenge_method, type: string, required: false, source: llm}
      - {name: challenge_dose, type: string, required: false, source: llm}
      - {name: challenge_timing, type: string, required: false, source: llm}
      - {name: evidence_text, type: text, required: true, source: align}
      - {name: source_location, type: string, required: true, source: structure}

  # -----------------------------------------------------------------------
  # 1.7 Swine（动物参数）
  # -----------------------------------------------------------------------
  Swine:
    display_name: "Swine Animal Parameters"
    primary_text: physiological_stage
    description: >
      Characteristics of the swine subjects used in the experiment,
      including breed, sex, age, physiological stage, body weight,
      and sample size.
    notes: |
      dedup_mode: exact
    extraction_guidance: |
      ## Extraction Rules

      1. breed: Record the full breed/cross designation (e.g.,
         "Duroc × Landrace × Yorkshire").

      2. sex: Use precise terms when available:
         - boar (intact male), sow (female that has farrowed),
           barrow (castrated male), gilt (young female, not farrowed)
         - male/female (when sex is mentioned but not further specified)
         - mixed (both sexes present)

      3. age: Initial age at experiment start (e.g., "21 days", "weaned").

      4. physiological_stage: weaned, grower, finisher, gestating, lactating, etc.

      5. initial_body_weight: Include value and unit (e.g., "7.5 ± 0.2 kg").

      6. sample_size: Number of animals per group.
    attributes:
      - {name: breed, type: string, required: true, source: llm}
      - {name: sex, type: enum, required: false, source: llm,
         values: [boar, sow, barrow, gilt, male, female, mixed]}
      - {name: age, type: string, required: false, source: llm}
      - {name: physiological_stage, type: string, required: false, source: llm}
      - {name: initial_body_weight, type: string, required: false, source: llm}
      - {name: sample_size, type: integer, required: false, source: llm}
      - {name: evidence_text, type: text, required: true, source: align}
      - {name: source_location, type: string, required: true, source: structure}

  # -----------------------------------------------------------------------
  # 1.8 Intervention（干预措施）
  # -----------------------------------------------------------------------
  Intervention:
    display_name: "Intervention / Treatment"
    primary_text: group_label
    description: >
      An experimental treatment applied to a group of animals. Each distinct
      dose level, administration route, or treatment combination is a separate
      Intervention entity. Positive antibiotic controls are also recorded here
      (with substance_name filled), NOT as Alternative entities.
    notes: |
      dedup_mode: exact
    extraction_guidance: |
      ## Extraction Rules

      1. GROUP LABEL: Use the paper's own group designation (e.g., "T1",
         "500 mg/kg OEO", "Ctrl+Antibiotic").

      2. DOSE: Record dose_value as a numeric value. For composite products,
         this is the total product addition amount.
         - 1 ppm = 1 mg/kg; 1% = 10000 mg/kg
         - Use dose_unit_standard for normalized units (mg/kg_feed, mg/kg_BW,
           CFU/kg_feed, U/kg_feed); keep original in dose_unit_original.

      3. ANTIBIOTIC CONTROLS: Positive-control antibiotics MUST be recorded as
         Intervention entities with substance_name filled (e.g.,
         "Chlortetracycline"). Do NOT create Alternative entities for them.

      4. MULTIPLE DOSES: Each dose level creates a separate Intervention entity.

      5. SAME INTERVENTION, MULTIPLE MODELS: If the same treatment is applied
         to multiple models (e.g., normal and challenged), create ONE
         Intervention entity and use multiple applied_to relationships.

      6. SUBSTANCE LINKAGE: For alternative substances, link via the "uses"
         reference field (NOT substance_name). substance_name is ONLY for
         antibiotic controls — fill with "Not applicable" for alternatives.
    attributes:
      - {name: group_label, type: string, required: true, source: llm}
      - {name: dose_value, type: float, required: false, source: llm}
      - {name: dose_unit_original, type: string, required: false, source: llm}
      - {name: dose_unit_standard, type: string, required: false, source: llm}
      - {name: administration_route, type: enum, required: false, source: llm,
         values: [diet, drinking_water, oral_gavage, injection, topical, other]}
      - {name: duration, type: string, required: false, source: llm}
      - {name: basal_diet, type: string, required: false, source: llm}
      - {name: substance_name, type: string, required: false, source: llm}
      - {name: evidence_text, type: text, required: true, source: align}
      - {name: source_location, type: string, required: true, source: structure}
    references:
      - {name: substance, target_entity: Alternative, target_field: standard_name, edge_type: uses}
      - {name: composite_substance, target_entity: Composite_Product, target_field: product_name, edge_type: uses}
      - {name: applied_to_model, target_entity: Swine_Model, target_field: stressor_name, edge_type: applied_to}

  # -----------------------------------------------------------------------
  # 1.9 Control_Group（对照组）
  # -----------------------------------------------------------------------
  Control_Group:
    display_name: "Control Group"
    primary_text: group_name
    description: >
      A control/comparison group in the experiment. Must be accurately
      classified by its role: negative_control, positive_control,
      basal_control, sham, or challenged_control.
    notes: |
      dedup_mode: exact
    extraction_guidance: |
      ## Extraction Rules

      1. GROUP TYPE SELECTION:
         - negative_control: Absolute blank (no treatment, no challenge)
         - positive_control: Antibiotic or known-effective substance control
         - basal_control: Basal diet control (nutrition trials only)
         - sham: Sham-treated (e.g., saline injection)
         - challenged_control: Challenged/stressed model control (receives
           challenge but no alternative intervention)

      2. CRITICAL: In challenge models, the comparison baseline for
         intervention effects MUST be the challenged_control, NOT the
         absolute blank (negative_control).

      3. Record the specific group designation as used in the paper.
    attributes:
      - {name: group_name, type: string, required: true, source: llm}
      - {name: group_type, type: enum, required: true, source: llm,
         values: [negative_control, positive_control, basal_control, sham, challenged_control]}
      - {name: description, type: text, required: false, source: llm}
      - {name: evidence_text, type: text, required: true, source: align}
      - {name: source_location, type: string, required: true, source: structure}

  # -----------------------------------------------------------------------
  # 1.10 Tissue_Site（组织部位）
  # -----------------------------------------------------------------------
  Tissue_Site:
    display_name: "Tissue / Sampling Site"
    primary_text: site_name
    description: >
      The biological site where a sample was collected or a measurement was
      taken. Includes organs, tissues, biofluids, digesta, feces, and the
      conceptual "Whole body" for macroscopic production metrics.
    extraction_guidance: |
      ## Extraction Rules

      1. Use standard anatomical names (e.g., "cecal content", "jejunal mucosa",
         "serum", "liver").

      2. site_category mapping:
         - content: digesta from GI tract (cecal, colonic, ileal content)
         - mucosa: mucosal scrapings/tissue (jejunal mucosa, ileal mucosa)
         - serum: blood serum or plasma
         - tissue: solid organ/tissue (liver, spleen, muscle)
         - feces: fecal samples
         - whole_organism: macroscopic performance metrics (ADG, ADFI, F:G, mortality)

      3. ALL macroscopic production performance indicators (ADG, ADFI, F:G,
         mortality) MUST point to site_name = "Whole body",
         site_category = "whole_organism".
    attributes:
      - {name: site_name, type: string, required: true, source: llm}
      - {name: site_category, type: enum, required: true, source: llm,
         values: [content, mucosa, serum, tissue, feces, whole_organism]}
      - {name: evidence_text, type: text, required: true, source: align}
      - {name: source_location, type: string, required: true, source: structure}

  # -----------------------------------------------------------------------
  # 1.11 Indicator（指标）
  # -----------------------------------------------------------------------
  Indicator:
    display_name: "Indicator / Measured Parameter"
    primary_text: standard_name
    description: >
      A biological, physiological, or biochemical parameter measured in the
      experiment. Each indicator is bound to a Tissue_Site (via measured_in)
      and a Method (via uses_method).
    extraction_guidance: |
      ## Extraction Rules

      1. INDICATOR CATEGORIES:
         - macro_phenotype: Growth performance (ADG, ADFI, F:G, FBW),
           digestibility, diarrhea rate, mortality, VH/CD
         - microbiome: Alpha diversity (Shannon, Chao1), beta diversity
           (PCoA/NMDS), phylum/genus/species relative abundance
         - metabolome: SCFAs (acetate, propionate, butyrate), bile acids,
           biogenic amines
         - molecular: Gene/protein expression (ZO-1, Claudin-1, TNF-α, etc.)

      2. Each Indicator MUST specify:
         - Sampling site (via measured_in reference to Tissue_Site)
         - Measurement method (via uses_method reference to Method)

      3. For digestibility: specify type (apparent total tract, AID, SID)
         and nutrient (DM, CP, GE, etc.) in the standard_name.

      4. For gut morphology: specify intestinal segment and metric
         (e.g., "Jejunal VH", "Ileal CD", "Duodenal VH/CD").

      5. evidence_text MUST include sentences describing the measurement
         method, sampling site, and procedure (1-3 sentences).
    attributes:
      - {name: standard_name, type: string, required: true, source: llm}
      - {name: abbreviation, type: string, required: false, source: llm}
      - {name: unit, type: string, required: false, source: llm}
      - {name: indicator_category, type: enum, required: true, source: llm,
         values: [macro_phenotype, microbiome, metabolome, molecular]}
      - {name: evidence_text, type: text, required: true, source: align}
      - {name: source_location, type: string, required: true, source: structure}
    references:
      - {name: measured_in_site, target_entity: Tissue_Site, target_field: site_name, edge_type: measured_in}
      - {name: measurement_method, target_entity: Method, target_field: method_name, edge_type: uses_method}

  # -----------------------------------------------------------------------
  # 1.12 Method（测定方法）
  # -----------------------------------------------------------------------
  Method:
    display_name: "Measurement Method"
    primary_text: method_name
    description: >
      The analytical or experimental method used to measure an indicator.
      Includes molecular techniques (qPCR, Western blot, ELISA), sequencing
      (16S rRNA), chromatography (GC, HPLC), and basic measurements (weighing).
    extraction_guidance: |
      ## Extraction Rules

      1. Record the specific method name (e.g., "qPCR", "ELISA", "16S rRNA
         gene sequencing", "GC-MS").

      2. Include instrument details, kit names, and software versions in the
         description field when available.

      3. If multiple methods are used for one indicator, create multiple
         uses_method relationships.
    attributes:
      - {name: method_name, type: string, required: true, source: llm}
      - {name: description, type: text, required: false, source: llm}
      - {name: evidence_text, type: text, required: true, source: align}
      - {name: source_location, type: string, required: true, source: structure}

  # -----------------------------------------------------------------------
  # 1.13 Result（结果）
  # -----------------------------------------------------------------------
  Result:
    display_name: "Experimental Result"
    primary_text: p_value_original_text
    description: >
      A statistically evaluated experimental result comparing an intervention
      group to a control group. Each Result is linked to an Indicator
      (via corresponds_to), Tissue_Site (via occurs_in), and Control_Group
      (via compared_to). The direction of effect is expressed through the
      relationship type from Intervention to Result (increases/decreases,
      upregulates/downregulates, enriches/depletes, affects).
    notes: |
      dedup_mode: exact
    extraction_guidance: |
      ## Extraction Rules

      1. EXTRACT ALL STATISTICAL COMPARISONS regardless of P-value.

      2. DIRECTION: Effect direction is expressed SOLELY through the
         Intervention→Result relationship type, NOT in Result attributes:
         - increases/decreases: continuous numeric phenotypes
         - upregulates/downregulates: gene/protein expression
         - enriches/depletes: microbial relative abundance
         - affects: catch-all or non-significant results

      3. COMPARISON BASELINE: Only extract comparisons vs Control_Group
         (via compared_to reference). In challenge models, the baseline
         MUST be the challenged_control. Do NOT extract intervention-vs-
         intervention comparisons.

      4. SIGNIFICANCE:
         - p_less_0.01: P < 0.01
         - p_less_0.05: P < 0.05
         - trend_0.05_0.1: 0.05 ≤ P < 0.10
         - not_significant: P ≥ 0.10 or not significant
         Record the EXACT original P-value text in p_value_original_text.

      5. MULTIPLE TIME POINTS: Each time point creates a separate Result entity.

      6. evidence_text: Copy the EXACT original English sentence(s) describing
         this result (1-2 sentences). If one sentence contains multiple results,
         copy it into each Result entity.
    attributes:
      - {name: p_value, type: float, required: false, source: llm}
      - {name: p_value_original_text, type: string, required: true, source: llm}
      - {name: corrected_significance, type: string, required: false, source: llm}
      - {name: effect_size, type: string, required: false, source: llm}
      - {name: time_point, type: string, required: false, source: llm}
      - {name: subgroup, type: string, required: false, source: llm}
      - {name: significance_level, type: enum, required: true, source: llm,
         values: [p_less_0.01, p_less_0.05, trend_0.05_0.1, not_significant]}
      - {name: evidence_text, type: text, required: true, source: align}
      - {name: source_location, type: string, required: true, source: structure}
    references:
      - {name: result_indicator, target_entity: Indicator, target_field: standard_name, edge_type: corresponds_to}
      - {name: result_site, target_entity: Tissue_Site, target_field: site_name, edge_type: occurs_in}
      - {name: result_control, target_entity: Control_Group, target_field: group_name, edge_type: compared_to}
