phases:
  gate:
    description: "Scan for core entities — gate check before full extraction"
    sections: [methods, body, abstract]
    extracts: [Alternative, Composite_Product]
    gate:
      entity: Alternative
      condition: "classification not in ['Other', '', 'unmatched']"
      on_fail: skip_article

  bulk:
    description: "Extract all remaining entities from the full document"
    sections: [methods, body, results, discussion]
    extracts:
      [Experiment, Swine_Model, Swine, Intervention, Control_Group,
       Tissue_Site, Indicator, Method, Result]
    context_from: [gate]
