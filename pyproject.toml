[project]
name = "llm-extract"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "lxml>=5.3",
    "pyyaml>=6.0",
    "regex>=2024",
    "click>=8.0",
    "pandas>=3.0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.25"]

[project.scripts]
llm-extract = "src.cli:cli"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]
