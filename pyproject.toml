[project]
name = "zhongnong-kg"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "lxml>=5.3",
    "pandas>=2.2",
    "jsonschema>=4.23",
    "litellm>=1.0",
    "pydantic-settings>=2.0",
    "biopython>=1.84",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.25"]

[project.scripts]
zhongnong-kg = "src.run_pipeline:cli"
