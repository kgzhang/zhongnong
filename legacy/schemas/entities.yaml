entities:
  Alternative:
    display_name: "Antibiotic Alternative Substance"
    primary_text: standard_name
    description: >
      Active compound, microorganism, or biological product tested as a
      replacement for in-feed antibiotics in swine production. Includes
      plant extracts, probiotics, organic acids, enzymes, trace elements,
      oligosaccharides, polysaccharides, and bioactive peptides. This entity
      covers SINGLE substances only.  For multi-component blends, use the
      Composite_Product entity instead.
    extraction_guidance: |
      ## Extraction Rules for Alternative (from BACKGROUND.md 3.1)

      1. SCAN: Search the entire paper, especially the Materials & Methods
         section, for ALL substances administered with the intent to replace
         or reduce antibiotic use in pigs. Look for: feed additives, dietary
         supplements, commercial products, natural compounds, fermentation
         products, probiotics, prebiotics, enzymes, organic acids, plant
         extracts, trace elements, bioactive peptides, and oligosaccharides.

      2. VOCABULARY MATCH: For each substance found, match it against the
         candidate vocabulary in ALTERNATIVE.tsv. Use fuzzy matching.
         - Vocabulary match found → record the standard_name exactly as it
           appears in the vocabulary, and mark match_source as "exact" or
           "fuzzy" accordingly. The classification will be auto-populated
           from the vocabulary's "Alternative_Class (一级分类)" column.
         - No vocabulary match AND it is a SINGLE substance → mark
           classification as "Other" (set by post-processor) and set
           match_source to "unmatched". Preserve the original name exactly
           as written in the paper in standard_name.
      3. ORIGINAL TEXT PRESERVATION: Copy the EXACT original English name
         and abbreviation verbatim from the source text into the
         original_text field. Do not normalize, translate, or modify it.

      4. EVIDENCE: Always provide evidence_text (the original sentence
         mentioning this substance) and source_location (e.g.,
         "Materials and Methods, paragraph 3").

      5. SIX STANDARD CLASSES plus OTHER:
         Standard: Plant_Extract, Trace_Element, Organic_Acid, Probiotic,
         Polysaccharides_and_Oligosaccharides, Enzyme, Bioactive_Peptides.
         Special: Other (single substance not in vocabulary).
    notes: |
      CRITICAL RULES:
      - DO NOT output 'none', 'unspecified', 'unknown', 'Not reported',
        'N/A', 'na', or any similar placeholder as a value. If the
        information is genuinely absent from the text, use an empty
        string '' instead.
      - Preserve the original English name and abbreviation verbatim from
        the source text in original_text. Do not invent names or merge
        entities.
      - The primary_text field is standard_name — this is the canonical
        identifier for entity_global_id purposes. Ensure uniqueness.
      - Vocabulary source: ALTERNATIVE.tsv, key field: "Alternative (具体物质)",
        class field: "Alternative_Class (一级分类)".

      mutually_exclusive_with: Composite_Product
      priority: 2
    vocabulary:
      source: ALTERNATIVE.tsv
      key_field: "Alternative (具体物质)"
      class_field: "Alternative_Class (一级分类)"
      subclass_field: "Subclass (二级分类)"
      match_fields: ["Alternative (具体物质)"]
      match_mode: fuzzy
      inject_in_prompt: false
      value_delimiter: ","
    attributes:
      - {name: standard_name, type: string, required: true, source: llm}
      - {name: abbreviation, type: string, required: false, source: llm}
      - {name: cas_number, type: string, required: false, source: llm}
      - {name: source_organism, type: string, required: false, source: llm}
      - {name: is_synthetic, type: boolean, required: false, source: llm}
      - {name: original_text, type: string, required: true, source: llm}
      - {name: classification, type: enum, required: true, source: post,
         values: [Plant_Extract, Trace_Element, Organic_Acid, Probiotic,
                  Polysaccharides_and_Oligosaccharides, Enzyme, Bioactive_Peptides, Other]}
      - {name: subclass, type: string, required: false, source: post}
      - {name: match_source, type: enum, required: true, source: post,
         values: [exact, fuzzy, unmatched]}
      - {name: evidence_text, type: text, required: true, source: align}
      - {name: source_location, type: string, required: true, source: structure}

  Composite_Product:
    display_name: "Composite Product / Commercial Blend"
    primary_text: product_name
    description: >
      A multi-component product (commercial or experimental blend) that
      contains two or more active antibiotic-alternative substances.
      Linked to its individual components via has_component relationships.
      Each component should be a separate Alternative entity.
    extraction_guidance: |
      CRITICAL: For each component in the composite blend, you MUST also extract a
      separate Alternative entity for that component.  The Composite_Product links
      to its components via the components array, but each component must exist as
      an independent Alternative entity with its own standard_name, classification,
      and evidence_text.

      ## Three-Step Rule for Composite Products
      Step 1 - DECOMPOSE: Identify all individual active components.
      For each single-substance component, create a separate Alternative entity.
      Step 2 - CREATE COMPOSITE NODE: Create ONE Composite_Product entity
      for the blend. Use the trade name or descriptive identifier.
      NEVER concatenate component names with "+".
      Step 3 - LINK: Populate the components array to create has_component
      relationships connecting the Composite_Product to each component Alternative.
      The components JSON array MUST list every component by its standard_name
      (matching the corresponding Alternative entity).
    notes: |
      CRITICAL RULES: DO NOT output 'none', 'unspecified', etc. Use the paper's
      own product name. Each component MUST also exist as a separate Alternative.
      Composite_Product and Other (on Alternative) are mutually exclusive:
      Other is for single unmatched substances; Composite_Product is for blends.

      mutually_exclusive_with: Alternative
      priority: 3
    attributes:
      - {name: product_name, type: string, required: true, source: llm}
      - {name: manufacturer, type: string, required: false, source: llm}
      - {name: is_commercial, type: boolean, required: false, source: llm}
      - {name: components, type: json_array, required: true, source: llm}
      - {name: evidence_text, type: text, required: true, source: align}
      - {name: source_location, type: string, required: true, source: structure}
    inline_relations:
      - {name: has_component, target: [Alternative, Composite_Product],
         via_field: components, multiple: true}

  Alternative_Class:
    display_name: "Alternative Classification"
    primary_text: class_name
    description: >
      Classification category for antibiotic alternative substances.
      Seven standard classes plus Other.  Created during post-processing,
      NOT extracted by the LLM.
    notes: >
      This entity is created during graph building from the classification
      field on Alternative entities.  It is NEVER sent to the LLM.  Each
      unique classification value becomes one Alternative_Class node.
    attributes:
      - {name: class_name, type: string, required: true, source: structure}
      - {name: level, type: integer, required: false, source: structure}
      - {name: description, type: text, required: false, source: structure}

  Literature:
    display_name: "Literature Reference"
    primary_text: title
    description: >
      Published research article identified by DOI or PMID. This entity
      captures document-level metadata including the abstract conclusion,
      which must be extracted according to strict rules from the last 1-3
      sentences of the abstract.
    extraction_guidance: |
      ## Abstract Conclusion Extraction Rules (from BACKGROUND.md Section 2)

      1. LOCATE: Go to the LAST 1-3 sentences of the abstract only. Do not
         scan the entire abstract.

      2. IDENTIFY CONCLUSION SIGNAL PHRASES: Look for sentences beginning
         with any of these phrases (case-insensitive):
         - "In conclusion", "In summary"
         - "These results suggest that", "These results indicate that"
         - "Overall", "Therefore", "Collectively", "Taken together"
         - "Our findings demonstrate that", "Our results show that"

      3. COPY VERBATIM: Once you find a conclusory sentence matching one of
         the above patterns, copy it EXACTLY into the abstract_conclusion
         field. Do not change a single word, punctuation mark, or
         capitalization.

      4. FALLBACK: If NONE of the last 1-3 sentences contains any conclusory
         signal phrase listed above, take the very last sentence of the
         abstract as the conclusion. Copy it verbatim into abstract_conclusion
         and note "No explicit conclusion signal phrase found" as a remark
         (not inside the abstract_conclusion field itself).

      5. DO NOT: summarize, paraphrase, shorten, or combine sentences.
         The abstract_conclusion must be an EXACT copy of the source sentence(s).
    notes: >
      This entity is populated ENTIRELY by the pre-extractor from document
      metadata. It is NEVER sent to the LLM for extraction.
      - The primary_text field is title — this is the canonical identifier
        for entity_global_id purposes.
    attributes:
      - {name: doi, type: string, required: true, source: structure}
      - {name: pmid, type: string, required: true, source: structure}
      - {name: title, type: string, required: true, source: structure}
      - {name: journal, type: string, required: false, source: structure}
      - {name: abstract_conclusion, type: text, required: false, source: structure}
      - {name: publication_year, type: integer, required: false, source: structure}
      - {name: publication_date, type: string, required: false, source: structure}
      - {name: study_design, type: enum, required: false, source: structure,
         values: [completely_randomized, randomized_block, factorial, cross_over, other]}
      - {name: evidence_text, type: text, required: true, source: align}
      - {name: source_location, type: string, required: true, source: structure}

  Experiment:
    display_name: "Experiment / Trial"
    primary_text: experiment_id
    description: >
      A self-contained experimental unit within a publication. A single
      paper may contain one or multiple experiments (e.g., a growth trial
      and a digestibility trial). Each experiment has its own set of
      animal groups, interventions, and measurements. The experiment_id
      should uniquely identify the experiment within the paper (e.g.,
      "Exp. 1", "Trial A", "Experiment 2").
    extraction_guidance: |
      ## Extraction Rules for Experiment

      1. IDENTIFY EXPERIMENTAL UNITS: Read the Materials & Methods section
         and identify each self-contained experiment or trial. A paper
         may describe multiple experiments (e.g., "Experiment 1: Growth
         performance" and "Experiment 2: Digestibility trial").

      2. CREATE ONE ENTITY PER EXPERIMENT: Each distinct experiment gets
         its own Experiment entity with a unique experiment_id. Use the
         designation from the paper (e.g., "Exp. 1", "Trial 2") if provided.
         If not explicitly labelled, create a descriptive ID like
         "Growth Trial" or "Digestibility Trial".

      3. DESCRIPTION: Provide a brief factual description of the experiment's
         purpose, design, and duration. Extract this from the Materials &
         Methods section, not your own interpretation.

      4. SCOPE: All downstream entities (Swine, Intervention,
         Control_Group, Indicator, Result) should be linked to the
         appropriate Experiment via relationships.
    notes: >
      CRITICAL RULES:
      - DO NOT output 'none', 'unspecified', 'unknown', 'Not reported',
        'N/A', 'na', or any similar placeholder as a value. If the
        information is genuinely absent from the text, use an empty
        string '' instead.
      - The primary_text field is experiment_id — this is the canonical
        identifier for entity_global_id purposes.
      - Each experiment is a separate entity. Do not merge multiple
        experiments into one.
    attributes:
      - {name: experiment_id, type: string, required: true, source: llm}
      - {name: description, type: text, required: false, source: llm}
      - {name: evidence_text, type: text, required: true, source: align}
      - {name: source_location, type: string, required: true, source: structure}

  Swine:
    display_name: "Animal Parameters"
    primary_text: breed
    description: >
      Breed, sex, age, physiological stage, initial body weight, and
      sample size of experimental swine. All parameters must be extracted
      exclusively from the Materials & Methods section of the paper.
      Precision is critical: record exact numerical values with units
      for body weight, and exact breed designations as written.
    extraction_guidance: |
      ## Extraction Rules for Swine (from BACKGROUND.md 3.3)

      1. SOURCE: Extract ALL parameters SOLELY from the Materials & Methods
         section. Do not use information from the abstract or results.

      2. BREED: Record the exact breed or crossbreed designation as written
         in the paper (e.g., "Duroc × Landrace × Yorkshire", "PIC 337",
         "Yorkshire barrows"). If the paper does not specify the breed,
         leave breed as an empty string '' — do NOT output 'unspecified',
         'unknown', 'not reported', or similar placeholder text.

      3. SEX: Use these EXACT enum values:
         - boar (intact male), sow (reproductive female), barrow (castrated
           male)
         - male (general, when castration status is unclear)
         - female (general, when reproductive status is unclear)
         - mixed (both males and females used)

      4. AGE: Record the exact day-age (e.g., "21 days", "35 days old") or
         physiological stage description (e.g., "weaned at 21 days",
         "post-weaning", "growing-finishing phase"). Include units.

      5. PHYSIOLOGICAL_STAGE: Standard terms: "neonatal", "suckling",
         "weanling", "nursery", "growing", "finishing", "gestating",
         "lactating". Use the term that best matches the paper's description.

      6. INITIAL_BODY_WEIGHT: Record the EXACT value with units and
         variability if reported (e.g., "7.5 ± 0.2 kg", "7.0-8.0 kg
         (range)"). Do not round or convert.

      7. SAMPLE_SIZE: The number of animals per group (e.g., "12 pigs per
         pen, 6 replicates"). If the paper reports total N, calculate
         per-group N if possible. Record as an integer.

      8. EVIDENCE: Always provide evidence_text (the exact sentence
         describing animal parameters) and source_location.
         All parameters must be traceable to their original text.
    notes: >
      CRITICAL RULES:
      - DO NOT output 'none', 'unspecified', 'unknown', 'Not reported',
        'N/A', 'na', or any similar placeholder as a value. If the
        information is genuinely absent from the text, use an empty
        string '' instead.
      - Extract breed, sex, age, physiological_stage, initial_body_weight,
        and sample_size from the Materials and Methods section. If breed
        is not specified, leave empty — do NOT use 'unspecified' or
        'unknown'.
      - The primary_text field is breed — this is the canonical identifier
        for entity_global_id purposes.
      - All numerical values must include units. Copy ranges and
        variability (± SD, ± SEM) exactly as reported.
    attributes:
      - {name: breed, type: string, required: true, source: llm}
      - {name: sex, type: enum, required: false, source: llm,
         values: [boar, sow, barrow, male, female, mixed]}
      - {name: age, type: string, required: false, source: llm}
      - {name: physiological_stage, type: string, required: false, source: llm}
      - {name: initial_body_weight, type: string, required: false, source: llm}
      - {name: sample_size, type: integer, required: false, source: llm}
      - {name: evidence_text, type: text, required: true, source: align}
      - {name: source_location, type: string, required: true, source: structure}

  Intervention:
    display_name: "Intervention / Treatment"
    primary_text: intervention_target
    description: >
      A specific treatment regimen applied to an experimental group,
      defined by the substance administered, its dose, administration
      route, duration, and basal diet. Each DISTINCT dose level of the
      same substance constitutes a separate Intervention entity. Extract
      exclusively from the Materials & Methods section.
    extraction_guidance: |
      ## Extraction Rules for Intervention (from BACKGROUND.md 3.4)

      1. SOURCE: Extract ALL intervention details from the Materials &
         Methods section only.

      2. ONE INTERVENTION PER DISTINCT DOSE: If the same substance is
         tested at multiple dose levels (e.g., low 250 mg/kg, medium
         500 mg/kg, high 1000 mg/kg), create a SEPARATE Intervention
         entity for EACH dose level. Do not merge them.

      3. DOSE VALUES: Use the EXACT dose value and unit as written in the paper.
         Do NOT convert units. If dose is NOT reported, leave dose_value and
         dose_unit_original as empty strings '' — do NOT output 'none',
         'unspecified', or similar placeholders.

      4. ADMINISTRATION_ROUTE (EXACT enum values):
         - diet: mixed into feed (混饲)
         - drinking_water: dissolved in drinking water (饮水)
         - oral_gavage: delivered by oral gavage/oral dosing (灌胃)
         - injection: injected (intraperitoneal, intramuscular, etc.)
         - topical: applied to skin
         - other: any route not listed above (describe in notes)

      5. DURATION: The total treatment period (e.g., "28 days", "14 days
         post-weaning"). Include the time unit.

      6. BASAL_DIET: The base diet formulation (e.g., "corn-soybean meal
         based diet", "corn-soybean meal-fish meal based diet").

      7. POSITIVE_CONTROL: If the study included a positive control group
         with a specific antibiotic, record the antibiotic name AND dose
         (e.g., "chlortetracycline 500 mg/kg"). If no antibiotic positive
         control, leave empty.

      8. EVIDENCE: Provide evidence_text (the exact sentence describing
         the treatment regimen) and source_location.
    notes: >
      CRITICAL RULES:
      - DO NOT output 'none', 'unspecified', 'unknown', 'Not reported',
        'N/A', 'na', or any similar placeholder as a value. If the
        information is genuinely absent from the text, use an empty
        string '' instead.
      - Extract from Materials and Methods. Each treatment regimen with a
        DISTINCT dose should be a separate Intervention. If dose is not
        reported, leave dose_value and dose_unit_original empty — do NOT
        output 'none'.
      - The primary_text field is intervention_target — this is the
        canonical identifier for entity_global_id purposes.
      - Use the EXACT dose value and unit as written in the paper.
        Do NOT convert units.
    attributes:
      - {name: intervention_target, type: string, required: true, source: llm}
      - {name: dose_value, type: float, required: false, source: llm}
      - {name: dose_unit_original, type: string, required: false, source: llm}
      - {name: administration_route, type: enum, required: false, source: llm,
         values: [diet, drinking_water, oral_gavage, injection, topical, other]}
      - {name: duration, type: string, required: false, source: llm}
      - {name: basal_diet, type: string, required: false, source: llm}
      - {name: positive_control, type: string, required: false, source: llm}
      - {name: evidence_text, type: text, required: true, source: align}
      - {name: source_location, type: string, required: true, source: structure}
    references:
      - {name: intervention_target, target_entity: Alternative, target_field: standard_name,
         edge_type: targets}

  Control_Group:
    display_name: "Control Group"
    primary_text: group_name
    description: >
      A reference group against which treatment effects are compared.
      Each experiment typically has exactly ONE negative control
      (untreated, basal diet) and optionally ONE positive control
      (antibiotic-treated). In challenge studies, a challenged control
      group serves as the comparison baseline for evaluating protective
      effects of the intervention. Do NOT create multiple Control_Group
      entities for the same logical control group even if it is mentioned
      in multiple sentences.
    extraction_guidance: |
      ## Extraction Rules for Control_Group (from BACKGROUND.md 3.2, 4.1)

      1. IDENTIFY ALL CONTROL GROUPS: From the Materials & Methods section,
         identify every control group described in the experimental design.

      2. GROUP_TYPE (EXACT enum values):
         - negative_control: Untreated, basal diet only, no additive. This
           is the absolute blank/negative control.
         - positive_control: Antibiotic-treated group (e.g., diet
           supplemented with chlortetracycline, colistin, etc.).
         - basal_control: A control fed the same basal diet as treatment
           groups but without the test substance (sometimes synonymous
           with negative_control in non-challenge studies).
         - sham: A sham-treated control (e.g., saline gavage instead of
           pathogen challenge) used in challenge studies to control for
           the administration procedure itself.

      3. CARDINALITY: Each experiment typically has EXACTLY ONE negative
         control (negative_control or basal_control) and optionally ONE
         positive control. Do NOT create multiple Control_Group entities
         for the same logical control group just because it appears in
         multiple sentences or paragraphs. One logical group = one entity.

      4. CHALLENGE STUDY BASELINE: In studies with both a challenged and
         unchallenged control, the UNCHALLENGED group may be negative_control
         or basal_control, and the CHALLENGED group that receives no
         treatment is the negative_control for comparison purposes. Be
         explicit about which group serves as the comparison baseline
         for each result (see Result entity's compared_to_group field).

      5. GROUP_NAME: Use the exact group designation from the paper
         (e.g., "NC", "PC", "CON", "Control", "Negative Control").
         CRITICAL — DO NOT use doses or substance names as group names.
         For example, "0 g/kg MA" is WRONG; use "CON" or "Basal diet"
         instead. The group_name must reflect the GROUP LABEL as written
         in the paper, not the treatment or dose administered.

      6. EVIDENCE: Provide evidence_text (the exact sentence describing
         the control group) and source_location.

      ## DEDUPLICATION RULES:
      - Each experiment has exactly ONE negative control group and optionally
        ONE positive control group.
      - If the same control group is described in multiple places (e.g.,
        sows + piglets), create ONE entity with a descriptive name that
        covers both.
      - DO NOT create separate Control_Group entities for sows and piglets
        if they share the same control diet.
      - Use the name as given in the paper (e.g., "CON", "Control",
        "Basal diet"). If the paper uses abbreviations, use those.
      - Example: If sows get CON diet and piglets also get CON diet,
        create ONE "CON" group, not "CON (sows)" and "CON (piglets)"
        separately.
    notes: >
      CRITICAL RULES:
      - DO NOT output 'none', 'unspecified', 'unknown', 'Not reported',
        'N/A', 'na', or any similar placeholder as a value. If the
        information is genuinely absent from the text, use an empty
        string '' instead.
      - Each experiment typically has ONE negative control and optionally
        ONE positive control. Do NOT create multiple Control_Group entities
        for the same logical control group just because it appears in
        multiple sentences.
      - The primary_text field is group_name — this is the canonical
        identifier for entity_global_id purposes.
      - For challenge studies, the comparison baseline for evaluating
        intervention protective effects MUST be the challenged control
        group, NOT the unchallenged negative control. This is recorded
        via the compared_to relationship on Result entities.
    attributes:
      - {name: group_name, type: string, required: true, source: llm}
      - {name: group_type, type: enum, required: true, source: llm,
         values: [negative_control, positive_control, basal_control, sham]}
      - {name: description, type: text, required: false, source: llm}
      - {name: evidence_text, type: text, required: true, source: align}
      - {name: source_location, type: string, required: true, source: structure}

  Tissue_Site:
    display_name: "Tissue / Sampling Site"
    primary_text: site_name
    description: >
      The anatomical site from which a biological sample was collected
      or where a measurement was taken. This includes intestinal segments
      and their contents, internal organs, blood fractions, feces, and
      other biological specimens. Each distinct sampling location is a
      separate Tissue_Site entity.
    extraction_guidance: |
      ## Extraction Rules for Tissue_Site

      1. SOURCE: Extract sampling sites from the Materials & Methods
         section where sample collection procedures are described.

      2. SITE_NAME: Use standardized anatomical names. Examples:
         - Intestinal segments: "duodenum", "jejunum", "ileum", "cecum",
           "colon", "rectum"
         - Intestinal contents: "cecal content", "colonic content",
           "ileal content", "duodenal content", "jejunal content"
         - Intestinal tissues: "duodenal mucosa", "jejunal mucosa",
           "ileal mucosa", "colonic mucosa"
         - Internal organs: "liver", "spleen", "kidney", "lung", "heart",
           "mesenteric lymph node", "thymus"
         - Blood fractions: "serum", "plasma", "whole blood"
         - Other: "feces", "urine", "muscle (longissimus dorsi)",
           "subcutaneous fat", "backfat"

      3. SITE_CATEGORY (EXACT enum values):
         - content: luminal contents of any intestinal segment
         - mucosa: mucosal tissue scrapings or biopsies
         - serum: blood serum (after coagulation)
         - plasma: blood plasma (anticoagulant-treated)
         - tissue: solid tissue samples (organs, muscle, etc.)
         - feces: fecal samples

      4. SPECIFICITY: Be as specific as the paper allows. If the paper says
         "ileal mucosa", use "ileal mucosa", not just "ileum". If it says
         "cecal content", use "cecal content", not just "cecum".

      5. EVIDENCE: Provide evidence_text (the exact sentence describing
         sample collection) and source_location.
    notes: >
      CRITICAL RULES:
      - DO NOT output 'none', 'unspecified', 'unknown', 'Not reported',
        'N/A', 'na', or any similar placeholder as a value. If the
        information is genuinely absent from the text, use an empty
        string '' instead.
      - The primary_text field is site_name — this is the canonical
        identifier for entity_global_id purposes. Ensure consistency
        in naming across the entire dataset.
      - Each distinct anatomical location is a separate entity. Use
        consistent naming conventions (e.g., always "ileum" not sometimes
        "ileum" and sometimes "distal small intestine").
    attributes:
      - {name: site_name, type: string, required: true, source: llm}
      - {name: site_category, type: enum, required: false, source: llm,
         values: [content, mucosa, serum, tissue, feces]}
      - {name: evidence_text, type: text, required: true, source: align}
      - {name: source_location, type: string, required: true, source: structure}

  Indicator:
    display_name: "Measured Indicator"
    primary_text: abbreviation
    description: >
      A quantitative endpoint or parameter measured in the study. This
      encompasses growth performance, nutrient digestibility, intestinal
      morphology, microbiome diversity and composition, metabolome
      concentrations, blood biochemistry, immune markers, antioxidant
      capacity, and other biological measurements. Each unique combination
      of indicator + tissue site + measurement method constitutes a
      separate Indicator entity and must be linked to its corresponding
      Tissue_Site via the measured_in relationship.
    extraction_guidance: |
      ## Extraction Rules for Indicator (from BACKGROUND.md 3.5.1–3.5.6)

      ### 0. GENERAL RULES FOR ALL INDICATORS
      - Extract ONLY from the Materials & Methods section.
      - Each Indicator MUST have a clearly specified measured_in Tissue_Site.
      - Each Indicator MUST be linked to its measurement method via
        the uses_method relationship (pointing to a Method entity).
      - Provide evidence_text: the exact sentence(s) from Materials & Methods
        describing how and where this indicator was measured.

      ### 1. GROWTH PERFORMANCE INDICATORS (category: macro_phenotype)
      - ADG (Average Daily Gain, g/d), ADFI (Average Daily Feed Intake, g/d),
        F:G (Feed-to-Gain ratio), FBW (Final Body Weight, kg),
        IBW (Initial Body Weight, kg), daily gain variation coefficient.
      - Record measurement phase (e.g., "day 1-14", "day 15-28", "overall").
      - Record units (e.g., g/d, kg/d, kg).

      ### 2. DIGESTIBILITY INDICATORS (category: digestibility)
      - STRICTLY distinguish digestibility type from Methods:
        * Total tract apparent digestibility
        * Apparent ileal digestibility (AID)
        * Standardized ileal digestibility (SID)
      - Record the specific nutrient: DM (dry matter), CP (crude protein),
        GE (gross energy), EE (ether extract/crude fat), CF (crude fiber),
        NDF, ADF, individual amino acids (Lys, Met, Thr, Trp, etc.).
      - Record measurement time window (e.g., "day 21-24 fecal collection").
      - Record measurement method (e.g., "indicator method with Cr2O3",
        "total collection method").
      - Each nutrient-digestibility_type combination = one Indicator.

      ### 3. INTESTINAL MORPHOLOGY INDICATORS (category: intestinal_morphology)
      - MUST specify the EXACT intestinal segment per Indicator entity.
      - Parameters: VH (Villus Height, μm), CD (Crypt Depth, μm),
        VH/CD ratio, mucosal thickness (μm), goblet cell count,
        intraepithelial lymphocyte count.
      - Each intestinal_segment + morphology_parameter combination = one
        Indicator (e.g., "duodenum VH", "jejunum CD", "ileum VH/CD").
      - Record staining method (e.g., "HE staining", "PAS staining").

      ### 4. MICROBIOME INDICATORS (category: microbiome)
      - Alpha diversity: Shannon index, Simpson index, Chao1, ACE,
        Observed species. Each diversity metric = one Indicator.
      - Beta diversity: PCoA, NMDS (record as qualitative: community
        structure separation captured in Result).
      - Taxonomic relative abundance: MUST specify exact taxonomic level
        and name (e.g., "Firmicutes (phylum) relative abundance",
        "Lactobacillus (genus) relative abundance"). Each taxon = one
        Indicator.
      - MUST specify sampling site: e.g., "cecal content", "colonic content",
        "feces", "ileal content".

      ### 5. METABOLOME INDICATORS (category: metabolome)
      - Short-chain fatty acids (SCFA): acetate, propionate, butyrate,
        isobutyrate, valerate, isovalerate. Each SCFA = one Indicator.
      - Other metabolites: bile acids, biogenic amines, indoles, phenols,
        lactate, ammonia.
      - MUST specify sampling site (e.g., "cecal content", "colonic content")
        and concentration unit (e.g., μmol/g, mmol/L, mg/g).

      ### 6. GENE/PROTEIN EXPRESSION (category: molecular)
      - MUST specify target tissue (e.g., "jejunal mucosa", "liver",
        "mesenteric lymph node") as measured_in Tissue_Site.
      - Tight junction proteins: ZO-1, Claudin-1, Occludin, JAM-A.
      - Mucins: MUC2, MUC5AC.
      - Pro-inflammatory cytokines: TNF-α, IL-1β, IL-6, IL-8, IFN-γ.
      - Anti-inflammatory cytokines: IL-10, TGF-β.
      - Nutrient transporters: GLUT2, SGLT1, PEPT1, FATP4.
      - Each target_gene + tissue combination = one Indicator.
      - Record measurement method (qPCR, Western blot, ELISA, RNA-seq).
      - Record internal reference gene/protein (e.g., GAPDH, β-actin).

      ### 7. BLOOD BIOCHEMISTRY INDICATORS (category: blood_biochemistry)
      - Sampling site: serum or plasma (via anterior vena cava or cardiac
        puncture). Record as measured_in Tissue_Site.
      - Immunoglobulins: IgA, IgG, IgM (category may also be immune).
      - Inflammatory markers: endotoxin (LPS), haptoglobin, CRP.
      - Metabolic products: glucose (GLU), blood urea nitrogen (BUN),
        total protein (TP), albumin (ALB), triglycerides (TG),
        total cholesterol (TC), creatinine (CREA).
      - Record measurement kit/method and units (e.g., "commercial ELISA
        kit, mg/mL", "clinical biochemistry analyzer, mmol/L").

      ### 8. IMMUNE INDICATORS (category: immune)
      - Immune cell populations, cytokine levels (serum), antibody titers,
        lymphocyte proliferation, phagocytic activity.
      - Overlaps with blood_biochemistry for serum immunoglobulins;
        use immune as the primary category for immune-function measurements.

      ### 9. ANTIOXIDANT INDICATORS (category: antioxidant)
      - T-SOD (Total Superoxide Dismutase), GSH-Px (Glutathione Peroxidase),
        MDA (Malondialdehyde), T-AOC (Total Antioxidant Capacity),
        CAT (Catalase), ROS (Reactive Oxygen Species), GSH (Glutathione).
      - Record tissue/serum source and units (e.g., U/mL, U/mg protein).

      ### 10. OTHER INDICATORS (category: other)
      - Diarrhea rate/index: record observation period and scoring criteria.
      - Mortality: record count and percentage.
      - Organ indices: spleen index, liver index, thymus index
        (organ weight / body weight × 100).
      - Intestinal permeability: D-lactate, DAO (diamine oxidase),
        FITC-dextran permeability assay.
      - Meat quality parameters.
      - Each indicator still requires measured_in Tissue_Site where applicable.

      ### Microbiome Diversity Indicators (DO NOT SKIP):
      These bioinformatics/statistical methods produce VALID indicator entities:
      - Alpha diversity indices: Shannon, Simpson, Chao1, ACE, Observed species, Faith's PD
      - Beta diversity: PCoA, NMDS, PERMANOVA, Bray-Curtis, UniFrac, Jaccard
      - Differential abundance: LEfSe, DESeq2, ANCOM, ALDEx2
      These ARE valid indicators. Each must have: standard_name, abbreviation,
      unit (e.g., "index" or "distance"), measurement_method (e.g., "16S rRNA
      sequencing"), measured_in (e.g., "cecal content"), and
      indicator_category="microbiome".

      ### Category Quick Reference (from BACKGROUND.md §3.5):
      - macro_phenotype: ADG (g/d), ADFI (g/d), F:G (ratio), FBW (kg)
      - digestibility: DM digestibility (%), CP digestibility (%), GE digestibility (%)
      - intestinal_morphology: VH (μm), CD (μm), VH/CD, goblet cell count
      - microbiome: Shannon, Chao1, relative abundance of [taxon]
      - metabolome: acetate (μmol/g), butyrate (μmol/g), propionate (μmol/g)
      - molecular: ZO-1, Occludin, Claudin-1, TNF-α, IL-1β, IL-10
      - blood_biochemistry: IgA (mg/mL), IgG, IgM, T-AOC (U/mL), MDA (nmol/mL)
      - immune: IL-10, TNF-α, IL-1β, TGF-β
      - antioxidant: T-SOD (U/mg), GSH-Px, CAT, MDA, T-AOC
      - other: diarrhea rate (%), mortality (%), organ index

      ### EVIDENCE REQUIREMENT
      For EVERY Indicator entity, copy the 1-3 sentences from Materials &
      Methods that describe the measurement method, sampling site, and
      operational steps into the evidence_text field. If the same paragraph
      describes multiple indicators, copy the paragraph into each indicator's
      evidence_text (one-to-many copy principle).
    notes: >
      CRITICAL RULES:
      - DO NOT output 'none', 'unspecified', 'unknown', 'Not reported',
        'N/A', 'na', or any similar placeholder as a value. If the
        information is genuinely absent from the text, use an empty
        string '' instead.
      - The primary_text field is abbreviation — this is the canonical
        identifier for entity_global_id purposes. Ensure each abbreviation
        is unique within the dataset; if necessary, disambiguate by
        appending the tissue site (e.g., "VH_duodenum", "VH_jejunum").
      - Each Indicator MUST have a clearly defined measured_in Tissue_Site
        (via the measured_in relationship). If the paper does not specify
        the tissue site, note this deficiency but do NOT invent one.
      - indicator_category mapping:
        * macro_phenotype: growth performance (ADG, ADFI, F:G, FBW)
        * digestibility: nutrient digestibility (DM, CP, GE, amino acids)
        * intestinal_morphology: VH, CD, VH/CD, goblet cells
        * microbiome: alpha diversity, taxonomic relative abundance
        * metabolome: SCFA, bile acids, biogenic amines
        * molecular: gene/protein expression (qPCR, Western blot)
        * blood_biochemistry: serum/plasma biochemical panels
        * immune: immunoglobulins, cytokines, immune cell assays
        * antioxidant: T-SOD, GSH-Px, MDA, T-AOC, CAT
        * other: diarrhea rate, mortality, organ indices, permeability
      - Each unique indicator+tissue_site+method combination is a separate
        entity. Do not merge different indicators into one entity.
    attributes:
      - {name: standard_name, type: string, required: true, source: llm}
      - {name: abbreviation, type: string, required: true, source: llm}
      - {name: unit, type: string, required: false, source: llm}
      - {name: measurement_method, type: string, required: false, source: llm}
      - {name: indicator_category, type: enum, required: false, source: llm,
         values: [macro_phenotype, digestibility, intestinal_morphology,
                  microbiome, metabolome, molecular, blood_biochemistry,
                  immune, antioxidant, other]}
      - {name: measured_in, type: string, required: false, source: llm}
      - {name: evidence_text, type: text, required: true, source: align}
      - {name: source_location, type: string, required: true, source: structure}
    references:
      - {name: measured_in, target_entity: Tissue_Site, target_field: site_name,
         edge_type: measured_in}
      - {name: measurement_method, target_entity: Method, target_field: method_name,
         edge_type: uses_method}

  Method:
    display_name: "Assay / Measurement Method"
    primary_text: method_name
    description: >
      A biological experimental method used to measure an indicator or
      to process biological samples. This entity MUST ONLY capture
      BIOLOGICAL EXPERIMENTAL METHODS — not statistical tests, not
      bioinformatics analysis tools, not generic laboratory operations.
      Each Method entity is linked to the Indicator(s) it measures via
      the uses_method relationship.
    extraction_guidance: |
      ## Extraction Rules for Method

      ### THIS ENTITY ONLY CAPTURES BIOLOGICAL EXPERIMENTAL METHODS.

      ## WHAT TO EXTRACT (specific analytical/laboratory methods):
      - Named techniques with instruments: "gas chromatography (CP-3800, Varian)", "16S rRNA sequencing (Illumina NovaSeq)"
      - Specific assay kits/methods: "ELISA (R&D Systems)", "BCA protein assay", "PAS staining"
      - Named analytical procedures: "proximate analysis (AOAC)", "gross energy determination (bomb calorimetry)"
      - DNA/RNA extraction: "Fecal DNA Isolation Kit (Omega D4015-01)"

      ### METHODS THAT MUST NOT BE EXTRACTED (BLACKLIST):

      The following are NOT biological experimental methods and MUST NOT
      be extracted as Method entities:
      - STATISTICAL TESTS: T-test, ANOVA, MIXED procedure, GLM, Tukey's
        test, Duncan's multiple range test, Kruskal-Wallis test,
        Mann-Whitney U test, chi-square test — these are statistical
        analysis methods, not experimental methods.
      - BIOINFORMATICS/STATISTICAL ANALYSIS TOOLS: LEfSe analysis, PCoA,
        NMDS, alpha diversity analysis, PERMANOVA, ANOSIM, STAMP,
        DESeq2, edgeR — these are data analysis tools, not experimental
        methods.
      - GENERIC OPERATIONS: "weighing", "counting", "measuring",
        "recording", "sampling", "homogenizing" — too generic.
      - SOFTWARE TOOLS: SAS, SPSS, R, ImageJ (when used only as an
        image analysis tool, not as a measurement protocol), GraphPad
        Prism, QIIME2, Mothur, USEARCH — these are software used to
        RUN methods, not methods themselves.
      - CALCULATION FORMULAS: any formula or equation used for
        computation (e.g., "ADG = (final weight - initial weight) / days").
      - STANDARD REFERENCE NUMBERS: e.g., "AOAC method 930.15", "ISO 12345".
        These are identifiers, not method names. Use the descriptive name
        of the method instead (e.g., "oven drying method" instead of
        "AOAC 930.15").
      - GENERIC OBSERVATION/RECORDING ACTIVITIES: "growth performance
        measurement", "reproductive performance recording", "daily weighing",
        "feed recording", "counting" — these are activities, not methods.
      - SOFTWARE-BASED IMAGE ANALYSIS WITHOUT SPECIFIC HISTOLOGICAL TECHNIQUE:
        "Image analysis for morphology", "image analysis with ImageJ" —
        ImageJ alone is NOT a method unless paired with a specific
        histological staining protocol.
      - SIMPLE SCORING SYSTEMS: "fecal scoring", "diarrhea scoring", "health
        scoring" — these are subjective assessments, not analytical methods.

      ### DECISION RULE: Ask: "Does this describe how a biological sample
      was processed or a biological parameter was physically measured?"
      If the answer is NO, do NOT extract it as a Method entity.
    notes: >
      CRITICAL RULES:
      - DO NOT output 'none', 'unspecified', 'unknown', 'Not reported',
        'N/A', 'na', or any similar placeholder as a value. If the
        information is genuinely absent from the text, use an empty
        string '' instead.
      - The primary_text field is method_name — this is the canonical
        identifier for entity_global_id purposes.
      - THIS ENTITY ONLY CAPTURES BIOLOGICAL EXPERIMENTAL METHODS.
      - Explicitly NOT Methods (blacklist):
        * Statistical tests: T-test, ANOVA, MIXED procedure, GLM, Tukey's
          test, Duncan's test, Kruskal-Wallis, Mann-Whitney U, chi-square.
        * Bioinformatics tools: LEfSe analysis, PCoA, NMDS, alpha diversity
          analysis, PERMANOVA, DESeq2, edgeR, STAMP.
        * Generic operations: "weighing", "counting", "measuring".
        * Software tools: SAS, SPSS, ImageJ, GraphPad Prism, QIIME2.
      - If the method involves a commercial kit, record the kit name and
        manufacturer in the description field.
    attributes:
      - {name: method_name, type: string, required: true, source: llm}
      - {name: description, type: text, required: false, source: llm}
      - {name: evidence_text, type: text, required: true, source: align}
      - {name: source_location, type: string, required: true, source: structure}

  Result:
    display_name: "Statistical Result"
    primary_text: indicator_abbreviation
    description: >
      A statistically evaluated comparison between a treatment group and
      a control group, structured as a triple: tissue site + indicator +
      direction of change. All results with any statistical comparison
      reported in the paper must be extracted, regardless of P-value
      magnitude. The extraction follows a 4-tier hierarchy from
      macro-phenotype down to molecular expression.
    extraction_guidance: |
      ## Extraction Rules for Result (from BACKGROUND.md 4.1–4.5)

      ### 0. GENERAL EXTRACTION RULES
      - Extract EVERY result that reports a statistical comparison,
        regardless of P-value magnitude or significance.
      - Each Result entity is a triple: (tissue_site, indicator, direction).
      - If a single sentence describes changes in multiple indicators,
        SPLIT into separate Result entities — one per indicator.
        Copy the same evidence_text sentence into each one.
      - Every Result MUST be linked to its Indicator (via corresponds_to),
        its Tissue_Site (via occurs_in), and the comparison baseline
        Control_Group (via compared_to).

      ### 1. COMPARISON BASELINE RULES (from BACKGROUND.md 4.1)
      - The baseline for comparison must be "treatment group vs. control
        group" (horizontal comparison), NOT a pre-post or absolute comparison.
      - For challenge/stress models with BOTH an unchallenged blank control
        AND a challenged model control: the comparison baseline for
        evaluating the intervention's PROTECTIVE EFFECT must be the
        CHALLENGED CONTROL GROUP, not the unchallenged blank control.
      - Set compared_to_group to the group_name of the correct baseline
        Control_Group entity.

      ### 2. RELATION TYPE SELECTION TABLE (from BACKGROUND.md 4.2)
      Choose the EXACT relation_type based on the indicator category:
      - Numerical indicators (growth, digestibility, morphology, SCFA,
        blood biochemistry): use "increases" or "decreases"
      - Gene/protein expression: use "upregulates" or "downregulates"
      - Microbial relative abundance: use "enriches" or "depletes"
      - Diarrhea rate, mortality (usually decreases = improvement):
        use "decreases"
      - Unclear mechanism or cannot classify: use "affects" and explain in
        a remark.

      ### 3. FOUR-TIER EXTRACTION HIERARCHY (from BACKGROUND.md 4.5)
      Extract results following this priority order:

      TIER 1 — MACRO-PHENOTYPE (4.5.1):
      - Growth performance: ADG, ADFI, F:G, FBW changes.
      - Digestibility: specific nutrient digestibility by type.
      - Health/morphology: diarrhea rate, mortality, VH, CD, VH/CD
        (per intestinal segment).
      → relation_type: increases or decreases

      TIER 2 — MICROBIOME (4.5.2):
      - Alpha diversity: Shannon, Chao1, ACE changes.
      - Beta diversity: whether PCoA/NMDS shows community separation.
      - Taxonomic differential abundance: specific phyla/genera/species
        with direction of enrichment or depletion.
      MUST bind to sampling site (cecal content vs. feces).
      → relation_type: increases/decreases (diversity), enriches/depletes
        (taxa)

      TIER 3 — METABOLOME & BIOCHEMISTRY (4.5.3):
      - Gut metabolites: individual SCFAs (acetate, propionate, butyrate
        MUST be distinguished), bile acids, biogenic amines, indoles.
        MUST bind to sampling site.
      - Systemic/serum markers: immunoglobulins, inflammatory markers
        (LPS, haptoglobin), antioxidant markers (MDA, SOD, GSH-Px),
        metabolic profiles.
      → relation_type: increases or decreases

      TIER 4 — MOLECULAR EXPRESSION (4.5.4):
      - MUST specify target tissue (e.g., jejunal mucosa, liver).
      - Barrier function: tight junction proteins (ZO-1, Claudin-1,
        Occludin), mucins (MUC2).
      - Immune/inflammatory pathways: pro-inflammatory (TNF-α, IL-1β,
        IL-6) and anti-inflammatory (IL-10, TGF-β).
      - Nutrient transport/metabolism: GLUT2, SGLT1, PEPT1.
      → relation_type: upregulates or downregulates

      ### 4. ATTRIBUTE FILLING RULES (from BACKGROUND.md 4.4)
      - direction: increased / decreased / no_significant_change
        (must be one of these exact values).
      - p_value: numeric value if the paper provides it (e.g., 0.023).
        Leave empty if not reported.
      - p_value_original_text: EXACT original text (e.g., "P < 0.05",
        "P = 0.023", "not significant", "P > 0.05").
      - corrected_significance: if the paper uses multiple comparison
        correction, record the corrected threshold (e.g., "FDR < 0.05",
        "Bonferroni-adjusted P < 0.01").
      - effect_size: if provided (e.g., fold change, mean ± SD, Cohen's d).
      - time_point: if the result is at a specific time (e.g., "day 14",
        "week 3").
      - subgroup: if the result is for a specific subgroup (e.g., "barrows",
        "low-dose group").
      - significance_level: EXACT enum based on P value:
        * p_less_0.01: P < 0.01
        * p_less_0.05: P < 0.05
        * trend_0.05_0.1: 0.05 ≤ P < 0.10
        * not_significant: P ≥ 0.10 or explicitly stated as non-significant
      - evidence_text: EXACTLY the 1-2 core original sentences from Results
        or figure/table captions that directly describe this result.
        Copy verbatim, do not summarize or paraphrase (see 4.3).
      - source_location: e.g., "Table 2", "Figure 3", "Results section 2.1",
        "Supplementary Table S1".

      ### 5. EVIDENCE TEXT PRECISION (from BACKGROUND.md 4.3)
      - Copy the exact original English sentence(s) that describe the result.
      - Be precise: 1-2 sentences per result, not large blocks.
      - If one sentence describes multiple indicators, copy the SAME
        sentence into each indicator's Result entity (one-to-many copy).
      - Source can be from the main text, figure legends, or table footnotes.
    notes: >
      CRITICAL RULES:
      - DO NOT output 'none', 'unspecified', 'unknown', 'Not reported',
        'N/A', 'na', or any similar placeholder as a value. If the
        information is genuinely absent from the text, use an empty
        string '' instead.
      - The primary_text field is indicator_abbreviation — this is the
        canonical identifier for entity_global_id purposes. Combine with
        tissue_site and time_point for uniqueness if needed.
      - significance_level mapping: P < 0.01 → p_less_0.01,
        P < 0.05 → p_less_0.05, 0.05 ≤ P < 0.10 → trend_0.05_0.1,
        P ≥ 0.10 → not_significant.
      - relation_type selection:
        * Numerical indicators (ADG, VH, SCFA, blood biochemistry)
          → increases / decreases
        * Gene/protein expression → upregulates / downregulates
        * Microbial abundance → enriches / depletes
        * Unclear mechanism → affects
      - Comparison baseline for challenge studies MUST be the challenged
        control group, NOT the unchallenged negative control.
      - Every Result MUST be linkable back to an Indicator defined in the
        Materials & Methods section. If the indicator is not defined in
        M&M, mark this in a remark.
    attributes:
      - {name: indicator_abbreviation, type: string, required: true, source: llm}
      - {name: tissue_site, type: string, required: false, source: llm}
      - {name: direction, type: enum, required: true, source: llm,
         values: [increased, decreased, no_significant_change]}
      - {name: relation_type, type: enum, required: true, source: llm,
         values: [increases, decreases, upregulates, downregulates,
                  enriches, depletes, affects]}
      - {name: p_value, type: float, required: false, source: llm}
      - {name: p_value_original_text, type: string, required: false, source: llm}
      - {name: corrected_significance, type: string, required: false, source: llm}
      - {name: effect_size, type: string, required: false, source: llm}
      - {name: time_point, type: string, required: false, source: llm}
      - {name: subgroup, type: string, required: false, source: llm}
      - {name: significance_level, type: enum, required: true, source: llm,
         values: [p_less_0.01, p_less_0.05, trend_0.05_0.1, not_significant]}
      - {name: compared_to_group, type: string, required: false, source: llm}
      - {name: evidence_text, type: text, required: true, source: align}
      - {name: source_location, type: string, required: true, source: structure}
    references:
      - {name: indicator_abbreviation, target_entity: Indicator,
         target_field: abbreviation, edge_type: corresponds_to}
      - {name: tissue_site, target_entity: Tissue_Site,
         target_field: site_name, edge_type: occurs_in}
      - {name: compared_to_group, target_entity: Control_Group,
         target_field: group_name, edge_type: compared_to}
